{% extends 'admin/master.html' %}

{% block head %}
    {{ super() }}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block body %}
<div class="container-fluid" style="color: #333;">
    <header class="mb-4">
        <h2 class="fw-light">Bảng điều khiển</h2>
    </header>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card p-4 border-dark border-4 shadow-sm">
                <div class="text-muted small text-uppercase fw-bold mb-2">Khóa học chờ duyệt</div>
                <div class="h2 fw-bold mb-0">{{ stats.pending_course }}</div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4 border-warning border-4 shadow-sm">
                <div class="text-muted small text-uppercase fw-bold mb-2">Giảng viên chờ duyệt</div>
                <div class="h2 fw-bold mb-0">{{ stats.pending_lecturers }}</div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card p-4 shadow-sm">
                <h5 class="fw-bold mb-4">Danh mục khóa học</h5>
                <div style="height: 350px; position: relative;">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [{% for c in categories %}"{{ c.name }}",{% endfor %}],
                datasets: [{
                    label: 'Số lượng khóa học',
                    data: [{% for c in categories %}{{ c.courses|length }},{% endfor %}],
                    backgroundColor: '#222',
                    borderRadius: 4,
                    barThickness: 30
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true },
                    x: { grid: { display: false } }
                }
            }
        });
    });
</script>
{% endblock %}
