{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="main-wrapper">
    <div class="info-section">
        <h1 class="title mb-5">Tham gia vào khóa học</h1>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Học không giới hạn</p>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Theo dõi tiến trình</p>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Khám phá mọi lĩnh vực</p>
        </div>
    </div>

    <div class="form-section">
        <h1 class="mb-5">Đăng nhập tài khoản</h1>

        {% if err_msg %}
        <div class="alert alert-danger">
            <h4>{{ err_msg }}</h4>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="mt-3">
                <label class="medium ms-1">Email</label>
                <input name="email" required class="text-input mt-1 flex-1" type="email"
                       placeholder="Nhập địa chỉ email..."/>
            </div>

             <div class="mt-3">
                <label class="medium ms-1">Mật khẩu</label>
                <input name="email" required class="text-input mt-1 flex-1" type="email"
                       placeholder="Nhập mật khẩu..."/>
            </div>


            <button type="submit" class="positive-button mt-5 w-100">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
