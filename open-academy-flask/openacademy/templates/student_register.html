{% extends "base.html" %}
{% block title %}Đăng ký học viên{% endblock %}
{% block content %}
<div class="main-wrapper">
    <div class="info-section">
        <h1 class="title mb-5">Tham gia vào khóa học</h1>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Học không giới hạn</p>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Theo dõi tiến trình</p>
        </div>
        <div class="feature-item">
            <i class="fa-solid fa-circle-check"></i>
            <p class="medium">Khám phá mọi lĩnh vực</p>
        </div>
    </div>

    <div class="form-section">
        <h1 class="mb-5">Đăng ký tài khoản học viên</h1>

        {% if err_msg %}
        <div class="alert alert-danger">
            <h4>{{ err_msg }}</h4>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('student_register') }}" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-6">
                    <label class="medium ms-1">Họ</label>
                    <input name="last_name" required class="text-input mt-1 flex-1" type="text"
                           placeholder="Nhập họ..."/>
                </div>
                <div class="col-md-6">
                    <label class="medium ms-1">Tên</label>
                    <input name="first_name" required class="text-input mt-1 flex-1" type="text"
                           placeholder="Nhập tên..."/>
                </div>
            </div>

            <div class="mt-3">
                <label class="medium ms-1">Email</label>
                <input name="email" required class="text-input mt-1 flex-1" type="email"
                       placeholder="Nhập địa chỉ email..."/>
            </div>

            <div class="row mt-3">
                <div class="col-md-6">
                    <label class="medium ms-1">Mật khẩu</label>
                    <input name="password" id="password" required class="text-input mt-1 flex-1" type="password"
                           placeholder="Nhập mật khẩu..."/>
                </div>
                <div class="col-md-6">
                    <label class="medium ms-1">Xác nhận mật khẩu</label>
                    <input name="confirm_password" required class="text-input mt-1 flex-1" type="password"
                           placeholder="Nhập lại mật khẩu..."/>
                </div>
            </div>

            <div class="mt-3">
                <label class="medium ms-1">Mục tiêu học tập</label>
                <select name="goal" class="text-input mt-1 flex-1" required>
                    <option value="" disabled selected>-- Chọn mục tiêu --</option>
                    {% for goal in goals %}
                    <option value="{{ goal.name }}">{{ goal.value }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mt-3">
                <label class="medium ms-1">Trình độ hiện tại</label>
                <select name="level" class="text-input mt-1 flex-1" required>
                    <option value="" disabled selected>-- Chọn trình độ --</option>
                    {% for level in levels %}
                    <option value="{{ level.name }}">{{ level.value }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mt-3">
                <label class="medium ms-1">Ảnh đại diện</label>
                <input name="avatar" id="avatar-input" required class="text-input mt-1 flex-1" type="file"
                       accept="image/*"/>
                <img id="avatar-preview" class="preview-img" src="#" alt="Avatar Preview"/>
            </div>

            <div class="login-btn" onclick="this.closest('form').submit();">
                <i class="fa-solid fa-user-plus"></i>
                <button type="submit">ĐĂNG KÝ NGAY</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
