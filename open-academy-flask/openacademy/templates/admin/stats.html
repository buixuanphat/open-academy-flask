{% extends 'admin/master.html' %}

{% block body %}
<h2 class="text-center text-danger">THỐNG KÊ DOANH THU</h2>

<div class="row">
    <div class="col-md-5">
        <form>
            <div class="form-group">
                <input type="text" name="kw" placeholder="Nhập tên khóa học..." class="form-control" />
            </div>
            <div class="form-group">
                <label>Từ ngày</label>
                <input type="date" name="from_date" class="form-control" />
            </div>
            <div class="form-group">
                <label>Đến ngày</label>
                <input type="date" name="to_date" class="form-control" />
            </div>
            <input type="submit" value="Lọc dữ liệu" class="btn btn-info" />
        </form>
    </div>
    <div class="col-md-7">
        <div class="alert alert-success">
             <h4>Tổng doanh thu: {{ "{:,.0f}".format(total_rev) }} VNĐ</h4>
        </div>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>Mã KH</th>
                    <th>Tên khóa học</th>
                    <th>Doanh thu</th>
                    <th>Số học viên</th>
                </tr>
            </thead>
            <tbody>
                {% for s in stats %}
                <tr>
                    <td>{{ s[0] }}</td>
                    <td>{{ s[1] }}</td>
                    <td>{{ "{:,.0f}".format(s[2]) }} VNĐ</td>
                    <td>{{ s[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
