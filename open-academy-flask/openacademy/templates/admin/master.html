{% extends 'admin/base.html' %}

{% block head_css %}
    {{ super() }}
    <style>
        /* Sidebar và Navbar màu đen */
        .navbar-dark, .navbar-inverse { background-color: #000 !important; border: none; }
        .navbar-brand { font-weight: 800; letter-spacing: 1px; color: #fff !important; }
        
        /* Chỉnh lại các nút và bảng cho hiện đại */
        body { background-color: #f4f7f6; }
        .card, .well { border-radius: 15px; border: none; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #0d6efd; border: none; border-radius: 8px; }
        
        /* Màu chữ Menu */
        .nav-tabs .nav-link.active { border-bottom: 3px solid #0d6efd !important; font-weight: bold; }
    </style>
{% endblock %}
