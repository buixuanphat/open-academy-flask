{% extends "layout/base.html" %}
{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow p-4 border-0">
            <h3 class="text-center mb-4 fw-bold">Đăng Nhập</h3>
            <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập của bạn" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" name="password" class="form-control" placeholder="******" required>
    </div>
    <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Đăng Nhập</button>
    </div>
</form>
            <hr>
            <p class="text-center">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký</a></p>
        </div>
    </div>
</div>
{% endblock %}
