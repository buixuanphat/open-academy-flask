{% extends "layout/base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center my-5">
    <div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 500px; border: 1px solid #eee !important;">
        <h2 class="fw-bold text-uppercase mb-4 text-center" style="letter-spacing: 2px;">Tạo tài khoản</h2>

        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold text-uppercase">Họ</label>
                    <input type="text" name="last_name" class="form-control rounded-0 border-dark shadow-none" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label small fw-bold text-uppercase">Tên</label>
                    <input type="text" name="first_name" class="form-control rounded-0 border-dark shadow-none" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Email</label>
                <input type="email" name="email" class="form-control rounded-0 border-dark shadow-none" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase">Bạn là ai?</label>
                <select name="role" class="form-select rounded-0 border-dark shadow-none">
                    <option value="student">Học viên</option>
                    <option value="lecturer">Giảng viên</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-uppercase">Mật khẩu</label>
                <input type="password" name="password" class="form-control rounded-0 border-dark shadow-none" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-0 fw-bold py-2 text-uppercase">Đăng ký</button>
        </form>
    </div>
</div>
{% endblock %}
