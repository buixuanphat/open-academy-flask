{% extends "layout/base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Tạo Khóa Học Mới</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('instructor.create_course') }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên khóa học</label>
                            <input type="text" name="title" class="form-control" placeholder="Ví dụ: Lập trình Python từ cơ bản đến nâng cao" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Danh mục</label>
                                <select name="category_id" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Giá bán (VNĐ)</label>
                                <input type="number" name="price" class="form-control" placeholder="0 = Miễn phí" min="0">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả khóa học</label>
                            <textarea name="description" class="form-control" rows="5" placeholder="Tóm tắt nội dung khóa học giúp học viên dễ hình dung..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Ảnh bìa (Thumbnail)</label>
                            <input type="file" name="thumbnail" class="form-control" accept="image/*">
                            <div class="form-text">Nên chọn ảnh tỉ lệ 16:9 để hiển thị đẹp nhất.</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('instructor.dashboard') }}" class="btn btn-secondary me-md-2">Hủy</a>
                            <button type="submit" class="btn btn-success px-5">Tạo khóa học</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
