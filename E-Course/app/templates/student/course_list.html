{% extends 'layout/base.html' %}

{% block title %}Danh sách khóa học{% endblock %}

{% block content %}
<div class="container">
    <h2 class="my-4">Khóa học nổi bật</h2>
    <div class="row">
        {% for course in courses %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ course.title }}</h5>
                    <p class="card-text text-muted">{{ course.description[:100] }}...</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-danger fw-bold">{{ "{:,.0f}".format(course.price) }} VNĐ</span>
                        <button class="btn btn-sm btn-outline-primary">Xem chi tiết</button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
