<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}E-Course{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Chỉnh sửa lại các class của Bootstrap cho giống mẫu của bạn */
    body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #111; }

    .navbar { border-bottom: 1px solid #e0e0e0; padding: 12px 40px; }

    .btn-dark { background: #111; border: none; border-radius: 4px; padding: 8px 20px; }
    .btn-outline-dark { border: 2px solid #111; border-radius: 4px; font-weight: 600; }

    .hero { background: #f5f5f5; padding: 60px 40px; }

    /* Custom Course Card */
    .course-card { border: 1px solid #ccc; border-radius: 6px; overflow: hidden; transition: 0.3s; }
    .course-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    .card-header-custom { background: #333; color: #fff; font-size: 12px; padding: 8px 14px; }
    .card-body-img { background: #111; height: 170px; overflow: hidden; }
    .card-body-img img { width: 100%; height: 100%; object-fit: cover; }

    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ccc; border: none; margin: 0 5px; }
    .dot.active { background: #111; }

    footer { background: #111; color: #fff; padding-top: 50px; }
    footer a { color: #aaa; text-decoration: none; font-size: 13px; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  {% include 'layout/header.html' %}
<div class="container mt-3">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-dark border-dark rounded-0 small fw-bold text-uppercase" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
</div>
  {% block content %}{% endblock %}

  {% include 'layout/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
