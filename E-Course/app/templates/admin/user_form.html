{% extends "layout/admin_base.html" %}

{% block title %}{{ 'Chỉnh sửa' if user else 'Thêm mới' }} người dùng{% endblock %}
{% block header_title %}{{ 'Chỉnh sửa' if user else 'Thêm mới' }} người dùng{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm p-4">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Họ</label>
                        <input type="text" name="last_name" class="form-control" value="{{ user.last_name if user else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Tên</label>
                        <input type="text" name="first_name" class="form-control" value="{{ user.first_name if user else '' }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" 
                               {{ 'readonly disabled' if user else 'required' }}>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Mật khẩu {{ '(Để trống nếu không đổi)' if user else '' }}</label>
                        <input type="password" name="password" class="form-control" {{ '' if user else 'required' }}>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Vai trò</label>
                        <select name="role" class="form-select">
                            <option value="student" {{ 'selected' if user and user.role.value == 'student' }}>Học viên</option>
                            <option value="lecturer" {{ 'selected' if user and user.role.value == 'lecturer' }}>Giảng viên</option>
                            <option value="admin" {{ 'selected' if user and user.role.value == 'admin' }}>Admin</option>
                        </select>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-dark px-4">Lưu dữ liệu</button>
                        <a href="{{ url_for('admin_custom.manage_users') }}" class="btn btn-light border px-4">Hủy bỏ</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
